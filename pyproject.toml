[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "setfos_pnh"
version = "0.1.0"
description = "Solar cell photovoltaic optical simulation framework"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Author Name", email = "author@example.com"}
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
    "isort>=5.9",
]

[tool.setuptools]
packages = ["src"]
